name: Build PonWrt-DPI v1
on:
  workflow_dispatch:
    inputs:
      target:
        description: target
        required: true
        default: an7581
        type: string
permissions:
  contents: read
jobs:
  build:
    name: Build an7581 DPI
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6

      - name: Free space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean

      - name: Install deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd rsync time

      - name: Cache dl
        uses: actions/cache@v4
        with:
          path: dl
          key: dpi-dl-${{ hashFiles('feeds.conf.default','configs/dpi.config') }}
          restore-keys: dpi-dl-

      - name: Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cp configs/dpi.config .config
          make defconfig
          echo "=== 必备包强校验（缺一个直接失败）==="
          FAIL=0
          for k in uhttpd uhttpd-mod-ubus luci-mod-network luci-mod-status luci-mod-system \
                   luci-app-firewall luci-app-package-manager luci-compat luci-lua-runtime \
                   kmod-fwx fwxd libfwx_common luci-theme-fanchmwrt \
                   luci-app-fwx-dashboard luci-app-fwx-appfilter luci-app-fwx-user-record \
                   luci-app-fwx-record luci-app-fwx-traffic-stat luci-app-fwx-user; do
            if grep -qE "^CONFIG_PACKAGE_$k=y$" .config; then
              echo "  OK   $k"
            else
              echo "  FAIL $k"; FAIL=1
            fi
          done
          echo "=== 目标机型 ==="
          grep -E "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y$" .config
          test $FAIL -eq 0 || { echo "配置缺包，终止"; exit 1; }

      - name: Download
        run: make download -j8 || make download -j1 V=s

      - name: Build
        run: |
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee /tmp/build.log | tail -n 400
          echo "BUILD_OK"

      - name: Pack
        if: always()
        run: |
          mkdir -p out
          find bin/targets/airoha/an7581 -maxdepth 2 -type f \( -name '*.itb' -o -name '*.bin' -o -name '*.img' \) -exec cp -v {} out/ \; || true
          cp -v bin/targets/airoha/an7581/*.manifest out/ 2>/dev/null || true
          ls -lh out || true
          echo "=== 镜像内包清单核验 ==="
          for k in uhttpd luci-mod-network luci-app-firewall kmod-fwx fwxd luci-theme-fanchmwrt; do
            if grep -qE "^$k " out/*nokia_xg-040g-md-ubi.manifest 2>/dev/null; then echo "  OK   $k"; else echo "  FAIL $k"; fi
          done

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-dpi-an7581
          path: out/*
          if-no-files-found: warn
          retention-days: 7

      - name: Log tail on failure
        if: failure()
        run: echo "build failed, see build log above"
